name: Windows Remote Workspace

on:
  workflow_dispatch:

jobs:
  remote-workspace:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop Securely
        shell: powershell
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          # Enable Network Level Authentication (more secure)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1

          # Configure firewall
          netsh advfirewall firewall add rule name="RemoteWorkspaceAccess" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Temporary Admin User
        shell: powershell
        run: |
          $username = "User$((Get-Random -Minimum 1000 -Maximum 9999))"
          $password = [System.Web.Security.Membership]::GeneratePassword(16,4)
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "REMOTE_USER=$username" >> $env:GITHUB_ENV
          echo "REMOTE_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale (Latest)
        shell: powershell
        run: |
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -OutFile ts.msi
          Start-Process msiexec.exe -ArgumentList "/i ts.msi /quiet /norestart" -Wait
          Remove-Item ts.msi -Force

      - name: Connect to Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=workspace-$env:GITHUB_RUN_ID

          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host "======= CONNECTION DETAILS ======="
          Write-Host "IP Address: $env:TS_IP"
          Write-Host "Username : $env:REMOTE_USER"
          Write-Host "Password : $env:REMOTE_PASS"
          Write-Host "=================================="

      - name: Keep Session Alive (6 Hours)
        shell: powershell
        run: |
          Write-Host "Session active for 6 hours..."
          Start-Sleep -Seconds 21600
